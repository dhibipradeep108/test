{% load tz %}
{% get_current_timezone as TIME_ZONE %}
<form action="{% url 'set_timezone' %}" method = "POST">
    {% csrf_token %}
    <label for="tz">Time Zone : </label>
    <select name="tz">
        {% for city, t_z in tz.items %}
            <option value="{{t_z}}" {% if t_z == TIME_ZONE %}selected{% endif %}>{{city}}</option>
        {% endfor %}
    </select>
    <input type="submit" value="Set">
</form>
